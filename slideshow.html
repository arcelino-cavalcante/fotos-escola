<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Momentos Escola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Nothing+You+Could+Do&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        .handwritten {
            font-family: 'Nothing You Could Do', cursive;
        }

        .fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 1s ease-in-out, transform 10s linear;
        }

        #current-slide,
        #next-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1s ease-in-out;
        }

        /* Mosaic Styles */
        #mosaic-view {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }

        #mosaic-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mosaic-item {
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            animation: popIn 0.5s ease-out backwards;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes flash {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        .flash-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            pointer-events: none;
            animation: flash 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen w-screen bg-gray-900">

    <!-- Flash Overlay -->
    <div id="flash-overlay" class="hidden"></div>

    <!-- Background Layers for Slideshow -->
    <div id="next-slide"></div>
    <div id="current-slide" class="fade-enter-active"></div>

    <!-- Mosaic View Layer -->
    <div id="mosaic-view"></div>

    <!-- Overlay Info -->
    <div class="absolute bottom-0 left-0 w-full p-8 z-20 bg-gradient-to-t from-black/90 via-black/50 to-transparent">
        <div class="flex justify-between items-end max-w-7xl mx-auto">
            <div class="text-white">
                <div class="flex items-center gap-4 mb-2">
                    <div
                        class="w-12 h-12 rounded-full bg-yellow-400 flex items-center justify-center text-purple-900 shadow-lg border-2 border-white">
                        <i class="fas fa-camera text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold tracking-wider">MOMENTOS <span
                                class="text-yellow-400">ESCOLA</span></h1>
                        <p class="text-sm text-yellow-400 font-bold uppercase tracking-widest">Família Eliel 2025</p>
                    </div>
                </div>
                <div id="mission-display" class="mt-4 transition-opacity duration-500">
                    <span class="text-yellow-400 text-sm font-bold uppercase tracking-widest">Missão Cumprida:</span>
                    <h2 id="mission-text"
                        class="text-4xl md:text-5xl font-bold text-white drop-shadow-lg mt-1 handwritten">Carregando...
                    </h2>
                </div>
            </div>



            <!-- Stats & Goal -->
            <div class="flex flex-col items-end gap-4">
                <!-- Progress Bar -->
                <div class="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/20 w-64">
                    <div class="flex justify-between text-white text-xs font-bold mb-1">
                        <span>META COLETIVA</span>
                        <span id="counter-text">0 / 200</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-4 overflow-hidden border border-white/10">
                        <div id="progress-bar"
                            class="bg-gradient-to-r from-yellow-400 to-orange-500 h-full transition-all duration-1000"
                            style="width: 0%"></div>
                    </div>
                    <p class="text-gray-300 text-[10px] mt-1 text-right">Fotos tiradas hoje</p>
                </div>

                <!-- QR Code Placeholder -->
                <div
                    class="hidden md:flex flex-col items-center bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/20">
                    <p class="text-white text-sm font-bold mb-2">Participe agora!</p>
                    <div
                        class="w-24 h-24 bg-white rounded flex items-center justify-center text-gray-800 text-xs text-center p-1">
                        <i class="fas fa-qrcode text-4xl"></i>
                    </div>
                    <p class="text-gray-300 text-xs mt-2">Acesse e tire sua foto</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="absolute inset-0 z-50 flex items-center justify-center bg-gray-900 text-white">
        <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-5xl text-yellow-400 mb-4"></i>
            <p class="text-xl font-bold">Aguardando fotos...</p>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIxNGXEYA4AU8Kl3ktCO4mZ3dC4zxkU1s",
            authDomain: "formes-993cb.firebaseapp.com",
            projectId: "formes-993cb",
            storageBucket: "formes-993cb.firebasestorage.app",
            messagingSenderId: "68887552550",
            appId: "1:68887552550:web:efb79cce5416cb758f3ce7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let photos = [];
        let currentIndex = 0;
        let slideInterval;
        const SLIDE_DURATION = 5000; // 5s per slide
        const MOSAIC_INTERVAL = 5; // Show mosaic every 5 slides
        let slideCount = 0;
        let GOAL = 200; // Changed to let to allow updates from config
        let goalMet = false;

        // Listen for Goal Config
        onSnapshot(doc(db, "config", "main"), (doc) => {
            if (doc.exists()) {
                GOAL = doc.data().goal || 200;
                updateCounter(photos.length); // Refresh UI
            }
        });

        // Audio Context for Beep
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNewPhotoSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.value = 600; // High beep
            o.type = 'sine';
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start();
            g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            o.stop(audioCtx.currentTime + 0.1);

            setTimeout(() => {
                const o2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                o2.frequency.value = 800;
                o2.connect(g2);
                g2.connect(audioCtx.destination);
                o2.start();
                g2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                o2.stop(audioCtx.currentTime + 0.2);
            }, 100);
        }

        // DOM Elements
        const currentSlideEl = document.getElementById('current-slide');
        const nextSlideEl = document.getElementById('next-slide');
        const missionTextEl = document.getElementById('mission-text');
        const loadingEl = document.getElementById('loading');
        const flashOverlay = document.getElementById('flash-overlay');
        const mosaicView = document.getElementById('mosaic-view');
        const counterText = document.getElementById('counter-text');
        const progressBar = document.getElementById('progress-bar');

        // Listen for updates
        const q = query(collection(db, "school_gallery"), orderBy("timestamp", "desc"), limit(100));

        onSnapshot(q, (snapshot) => {
            let isFirstLoad = photos.length === 0;
            let newPhotosFound = false;

            // Update Counter
            updateCounter(snapshot.size);

            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    photos.unshift({
                        id: change.doc.id,
                        image: data.image,
                        mission: data.mission || "Momento Especial"
                    });
                    newPhotosFound = true;
                }
            });

            if (isFirstLoad && photos.length > 0) {
                loadingEl.classList.add('hidden');
                startSlideshow();
            } else if (newPhotosFound && !isFirstLoad) {
                // New photo arrived!
                triggerFlash();
                playNewPhotoSound();
                // Force jump to new photo
                jumpToSlide(0);
                resetInterval();
            }
        });

        function updateCounter(count) {
            counterText.innerText = `${count} / ${GOAL}`;
            const pct = Math.min((count / GOAL) * 100, 100);
            progressBar.style.width = `${pct}%`;

            if (count >= GOAL && !goalMet) {
                goalMet = true;
                triggerVictory();
            }
        }

        function triggerVictory() {
            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            const random = (min, max) => Math.random() * (max - min) + min;

            const interval = setInterval(function () {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);

                // Confetti
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));

                // Stars
                confetti({
                    shapes: ['star'],
                    colors: ['#FFE400', '#FFBD00', '#E89400', '#FFCA6C', '#FDFFB8'],
                    scalar: 1.2,
                    particleCount: 10,
                    startVelocity: 45,
                    spread: 360,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });

            }, 250);

            // Play Victory Sound (Fanfare)
            playVictorySound();
        }

        function playVictorySound() {
            // Simple major chord arpeggio
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => playBeep(freq, 0.2), i * 150);
            });
        }

        function playBeep(f, d) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
            o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d);
        }

        function triggerFlash() {
            flashOverlay.classList.remove('hidden');
            flashOverlay.classList.add('flash-effect');
            setTimeout(() => {
                flashOverlay.classList.remove('flash-effect');
                flashOverlay.classList.add('hidden');
            }, 500);
        }

        function updateDisplay(index) {
            if (photos.length === 0) return;
            const photo = photos[index];

            // Hide Mosaic if active
            if (mosaicView.classList.contains('active')) {
                mosaicView.classList.remove('active');
            }

            // Transition Logic
            nextSlideEl.style.backgroundImage = `url('${photo.image}')`;
            missionTextEl.innerText = `"${photo.mission}"`;

            currentSlideEl.style.opacity = 0;

            setTimeout(() => {
                currentSlideEl.style.backgroundImage = `url('${photo.image}')`;
                currentSlideEl.style.opacity = 1;
            }, 1000);
        }

        function showMosaic() {
            // Fill mosaic grid with top 12 photos
            mosaicView.innerHTML = '';
            const count = Math.min(photos.length, 12);
            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'mosaic-item';
                div.style.backgroundImage = `url('${photos[i].image}')`;
                div.style.animationDelay = `${i * 0.05}s`; // Staggered animation
                mosaicView.appendChild(div);
            }
            mosaicView.classList.add('active');
        }

        function startSlideshow() {
            if (photos.length > 0) {
                updateDisplay(0);
                resetInterval();
            }
        }

        function nextSlide() {
            if (photos.length === 0) return;

            slideCount++;

            // Every MOSAIC_INTERVAL slides, show mosaic for one cycle
            if (slideCount % MOSAIC_INTERVAL === 0) {
                showMosaic();
            } else {
                currentIndex = (currentIndex + 1) % photos.length;
                updateDisplay(currentIndex);
            }
        }

        function jumpToSlide(index) {
            currentIndex = index;
            slideCount = 1; // Reset mosaic counter slightly so we don't jump to mosaic immediately
            updateDisplay(currentIndex);
        }

        function resetInterval() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, SLIDE_DURATION);
        }

    </script>
</body>

</html>
