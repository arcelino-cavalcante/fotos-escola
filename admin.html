<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Aula Atividade em Rede</title><link rel="stylesheet" href="theme.css?v=20260814-2"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>body{background:#edf0ea;color:var(--ink)}.admin{max-width:1280px;margin:auto;padding:35px 22px}.admin .brand strong{color:var(--ink)}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.tools{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:14px;margin:30px 0}.card{background:#fff;border:1px solid #dce2dc;border-radius:22px;padding:22px}.big{font:700 3rem "Fraunces";margin:.3rem 0}.goal-row{display:flex;gap:8px}.goal-row input{width:100px;border:1px solid #ccd5ce;border-radius:10px;padding:8px}.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.photo{position:relative;aspect-ratio:4/5;background:#ccd5ce;border-radius:14px;overflow:hidden}.photo.pending{outline:4px solid var(--gold)}.photo img{width:100%;height:100%;object-fit:cover}.photo .meta{position:absolute;inset:auto 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,#071d2bee);color:#fff;font-size:.72rem}.photo button{position:absolute;top:8px;border:0;width:34px;height:34px;border-radius:50%;color:#fff}.photo .remove{right:8px;background:#b94032}.photo .approve{left:8px;width:auto;padding:0 11px;border-radius:999px;background:#287b55;font-weight:700}.status-pill{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:10px;background:#e9ae3b;color:#071d2b;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:80px}.warning{color:#a24e2c;font-size:.75rem}@media(max-width:900px){.gallery{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.gallery{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.tools .btn{width:100%}}</style></head>
<body><main class="admin"><header class="head"><div><div class="brand"><div class="brand-mark" style="background:var(--navy)"><i class="fa-solid fa-diagram-project"></i></div><div><strong>Aula Atividade em Rede</strong><small>Escola Liel Peixoto · 2026.2</small></div></div></div><div class="tools"><a class="btn btn-light" style="border:1px solid #ccd5ce;text-decoration:none" href="slideshow.html" target="_blank"><i class="fa-solid fa-display"></i> Abrir telão</a><button id="downloadBtn" class="btn btn-primary" onclick="downloadAll()"><i class="fa-solid fa-file-arrow-down"></i> Baixar tudo</button><button class="btn btn-danger" onclick="deleteAll()"><i class="fa-solid fa-trash"></i> Excluir tudo</button></div></header>
<section class="summary"><div class="card"><span class="eyebrow" style="color:var(--teal)">Fotos na rede</span><div id="total" class="big">0</div><span>registros publicados</span></div><div class="card"><span class="eyebrow" style="color:var(--teal)">Meta coletiva</span><div class="goal-row" style="margin-top:15px"><input id="goal" type="number" min="1" value="200"><button class="btn btn-primary" onclick="saveGoal()"><i class="fa-solid fa-check"></i></button></div></div><div class="card"><span class="eyebrow" style="color:var(--teal)">Qualidade</span><p style="margin-bottom:0">Novas fotos usam armazenamento em alta resolução sempre que disponível.</p></div></section><section id="gallery" class="gallery"><div class="empty">Carregando os registros...</div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";import{getFirestore,collection,query,orderBy,onSnapshot,deleteDoc,doc,setDoc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";import{getStorage,ref,deleteObject}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";const app=initializeApp({apiKey:"AIzaSyD4x9dCBN5RsxE-ZNvZQHuvXzUuDDlBpqA",authDomain:"foto-eliel.firebaseapp.com",projectId:"foto-eliel",storageBucket:"foto-eliel.firebasestorage.app",messagingSenderId:"293369079728",appId:"1:293369079728:web:8c856c1235fef597579875"}),db=getFirestore(app),storage=getStorage(app),config=doc(db,"config","main");let photos=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));onSnapshot(query(collection(db,"school_gallery"),orderBy("timestamp","desc")),s=>{photos=s.docs.map(d=>({id:d.id,...d.data()}));total.textContent=photos.length;gallery.innerHTML="";if(!photos.length){gallery.innerHTML='<div class="empty">Nenhuma foto publicada ainda.</div>';return}photos.forEach(p=>{const c=document.createElement("article");c.className="photo";const i=new Image;i.src=p.image;i.alt=p.mission||"Registro";const m=document.createElement("div");m.className="meta";m.innerHTML=`<strong>Aula Atividade em Rede</strong><br>${esc(p.mission||"Registro coletivo")}`;const b=document.createElement("button");b.className="remove";b.innerHTML='<i class="fa-solid fa-trash"></i>';b.title="Excluir foto";b.onclick=()=>remove(p.id);c.append(i,m,b);gallery.append(c)})});getDoc(config).then(s=>{if(s.exists())goal.value=s.data().goal||200});
window.saveGoal=async()=>{const v=parseInt(goal.value);if(v>0){await setDoc(config,{goal:v},{merge:true});alert("Meta atualizada.")}};window.approve=async id=>updateDoc(doc(db,"school_gallery",id),{approved:true,approvedAt:new Date()});async function erase(p){if(p.storagePath)try{await deleteObject(ref(storage,p.storagePath))}catch(e){console.warn(e)}await deleteDoc(doc(db,"school_gallery",p.id))}window.remove=async id=>{const p=photos.find(x=>x.id===id);if(p&&confirm("Excluir esta foto permanentemente?"))await erase(p)};window.deleteAll=async()=>{if(!photos.length)return;if(confirm(`Excluir permanentemente as ${photos.length} fotos?`)&&confirm("Esta ação não pode ser desfeita. Confirmar?"))await Promise.all(photos.map(erase))};window.downloadAll=async()=>{if(!photos.length)return alert("Nenhuma foto para baixar.");downloadBtn.disabled=true;downloadBtn.innerHTML="Preparando...";try{const z=new JSZip(),f=z.folder("aula-atividade-em-rede");for(let i=0;i<photos.length;i++){const blob=await(await fetch(photos[i].image)).blob();f.file(`foto-${String(i+1).padStart(3,"0")}.jpg`,blob)}saveAs(await z.generateAsync({type:"blob"}),"aula-atividade-em-rede-2026-2.zip")}finally{downloadBtn.disabled=false;downloadBtn.innerHTML='<i class="fa-solid fa-file-arrow-down"></i> Baixar tudo'}};
</script></body></html>
